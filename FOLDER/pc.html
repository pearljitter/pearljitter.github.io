<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ARCHIVE — pearl jitter</title>
    <meta name="description" content="An archive of architecture and interactive work by pearl jitter, browsable as a 3D grid, a tunnel or a list.">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/archive.css?v=fc12a336">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <header class="chrome">
        <h1 class="chrome__title">The Archive<span>abstraction, conceptual depth, scale</span></h1>
        <div class="segmented" role="tablist" aria-label="View">
            <div class="segmented__thumb"></div>
        </div>
        <a class="chrome__link" href="../index.html">Index</a>
    </header>

    <!-- 보기 1 · 3D 그리드 -->
    <section class="mode" id="mode-grid" role="tabpanel" aria-label="3D Grid"></section>

    <!-- 보기 2 · 터널 -->
    <section class="mode" id="mode-tunnel" role="tabpanel" aria-label="Tunnel">
        <div class="tunnel__stage">
            <div class="tunnel__edges"></div>
            <div class="tunnel__track"></div>
        </div>
        <div class="tunnel__scroll">
            <div class="tunnel__spacer"></div>
        </div>
    </section>

    <!-- 보기 3 · 목록 -->
    <section class="mode" id="mode-list" role="tabpanel" aria-label="List"></section>

    <div class="readout">
        <div class="readout__title"></div>
        <div class="readout__meta"></div>
    </div>
    <div class="hint"></div>

    <script src="js/works.js?v=ccd5f945"></script>
    <script src="js/mode-grid.js?v=f225f738"></script>
    <script src="js/mode-tunnel.js?v=126c1d6a"></script>
    <script src="js/mode-list.js?v=c6038a0d"></script>
    <script src="js/archive.js?v=bf71a5a5"></script>
</body>

</html>
