<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEARL JITTER ARCHIVE</title>
    <meta name="description" content="An archive of architecture and interactive work by pearl jitter, plotted by abstraction, scale and tone.">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://threejs.org">
    <link rel="stylesheet" type="text/css" href="simp_landingstyle.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: rgb(0, 0, 0);
        }

        canvas {
            display: block;
        }

        .container {
            display: flex;
            justify-content: right;
            align-items: right;
            padding: 10px;
        }

        .moveback-link {
            z-index: 20;
            position: absolute;
            align-items: center;
            justify-content: center;
            text-align: left;
            margin-right: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 5px 5px;
            text-decoration: none;
            font-size: 14px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: white;
            color: black;
        }

        #dotPreview {
            position: absolute;
            display: none;
            width: 200px;
            height: 200px;
            pointer-events: none;
            border: 1px solid white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            background-size: cover;
            background-position: center;
            z-index: 15;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <h1>THE ARCHIVE</h1>
    <h2>(abstraction, conceptual depth, scale)</h2>
    <div class="container">
        <div class="moveback-link">
            <a href="../index.html" class="btn">Go to Index</a>
        </div>
    </div>
    <div id="dotDescription"></div>
    <div id="dotPreview"></div>

    <script>
        // 🚀 Three.js 기본 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 정적인 장면이라 매 프레임이 아니라 변화가 있을 때만 렌더링한다.
        let needsRender = true;
        const invalidate = () => { needsRender = true; };

        // 📌 그리드의 크기와 간격 설정
        const gridSize = 16;   // 그리드 크기
        const gridDivisions = 32;  // 그리드 간격
        const half = gridSize / 0.8;

        // 그리드 라인 그리기 (최외각선 제외)
        // 세 평면 × 두 방향을 한 번에 처리한다.
        const gridPlanes = [
            (t, s) => [[t, -s, 0], [t, s, 0]],   // XY 평면 / X축 라인
            (t, s) => [[-s, t, 0], [s, t, 0]],   // XY 평면 / Y축 라인
            (t, s) => [[0, t, -s], [0, t, s]],   // YZ 평면 / Y축 라인
            (t, s) => [[0, -s, t], [0, s, t]],   // YZ 평면 / Z축 라인
            (t, s) => [[t, 0, -s], [t, 0, s]],   // ZX 평면 / Z축 라인
            (t, s) => [[-s, 0, t], [s, 0, t]]    // ZX 평면 / X축 라인
        ];

        for (let i = -gridDivisions / 2; i <= gridDivisions / 2; i++) {
            if (i === -gridDivisions / 2 || i === gridDivisions / 2) continue; // 최외각선 제외

            const t = i * (gridSize / gridDivisions);
            // 같은 불투명도를 쓰는 라인끼리 머티리얼을 공유한다.
            const material = new THREE.LineBasicMaterial({
                color: 0xffffff,
                opacity: 0.3 - Math.abs(i) * 0.03,
                transparent: true
            });

            for (const plane of gridPlanes) {
                const [a, b] = plane(t, half);
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(
                    new Float32Array([a[0], a[1], a[2], b[0], b[1], b[2]]), 3
                ));
                scene.add(new THREE.Line(geometry, material));
            }
        }

        // 📌 더 긴 x, y, z 축 흰색 선 그리기
        const axisLength = 100;
        const axisMaterial = new THREE.LineBasicMaterial({ color: 0xffffff });
        for (const dir of [[1, 0, 0], [0, 1, 0], [0, 0, 1]]) {
            const geometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-dir[0] * axisLength, -dir[1] * axisLength, -dir[2] * axisLength),
                new THREE.Vector3(dir[0] * axisLength, dir[1] * axisLength, dir[2] * axisLength)
            ]);
            scene.add(new THREE.Line(geometry, axisMaterial));
        }

        // 📚 축 라벨 — 폰트는 한 번만 받아서 여섯 개를 함께 만든다.
        const axisLabels = [
            ['CONCRETE', new THREE.Vector3(gridSize / 0.5, 0, 0)],
            ['ABSTRACT', new THREE.Vector3(-gridSize / 0.5, 0, 0)],
            ['BIG', new THREE.Vector3(0, gridSize / 1.5, 0)],
            ['SMALL', new THREE.Vector3(0, -gridSize / 1.5, 0)],
            ['SERIOUS', new THREE.Vector3(0, 0, gridSize / 0.5)],
            ['PLAYFUL', new THREE.Vector3(0, 0, -gridSize / 0.5)]
        ];

        new THREE.FontLoader().load(
            'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',
            function (font) {
                const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
                for (const [text, position] of axisLabels) {
                    const geometry = new THREE.TextGeometry(text, {
                        font: font, size: 0.7, height: 0, curveSegments: 12
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.copy(position);
                    scene.add(mesh);
                }
                invalidate();
            }
        );

        // 📍 작업 목록 — 제목 / 설명 / 링크 / 좌표를 한 곳에서 관리한다.
        // 좌표는 (구체성, 규모, 진지함).
        const works = [
            ['FUZZY UNIVERSE', 'FUZZY UNIVERSE_Interactive Sketch_Object Exercise_11.09.23', '0G_1_fuzzy.html', [-6, 5, -3]],
            ['CHUNKING RUN', 'CHUNKING RUN_Flash Game_A Sequel of a Trip to Hong Kong_01.01.24', '0G_2_chunking.html', [2, -3, -4]],
            ['STRAGGLER CARRIER', 'STRAGGLER CARRIER_Flash Game_A Sequel of a Trip to JungSeon_11.02.24', '0G_3_ski.html', [1, -1, -3]],
            ['ORIGAMI DRAGON', 'ORIGAMI DRAGON_Interactive Sketch_Mouse Interaction Exercise_01.08.20', '0G_4_dragon.html', [-2, -5, 1]],
            ['GALAGA', 'GALAGA_Flash Game_Arcade Game Exercise_11.09.20', '0G_5_galaga.html', [1, 5, 1]],
            ['PACGUY', 'PACGUY_Flash Game_Arcade Game Exercise_29.09.20', '0G_6_pacguy.html', [0, -4, -4]],
            ['GATHER', 'GATHER_Interactive Sketch_Gravity Exercise_14.04.24', '0G_7_gather.html', [-5, 6, -2]],
            ['TANGHULU', 'TANGHULU_Interactive Sketch_Object Exercise_11.09.10', '0G_8_tanghulu.html', [-4, -6, -5]],
            ['THOUGHTS', 'THOUGHTS_Text_27.01.25~', '0T_9_blog.html', [0, 0, 0]],
            ['VIRTIAL ESSENCE', 'VIRTIAL ESSENCE_Series of Interactive Sketches_06.12.24~', '0G_10_virtualEssence.html', [3, 0, 5]],
            ['A SHELTER OF HOMEOSTASIS', "A SHELTER OF HOMEOSTASIS_a sustainable alternative to an 'idealized nature'_21.11.24", '0A_11_homeostasis.html', [6, -2, 6]],
            ['READER', 'READER_09.03.25', '0G_12_reader.html', [6, 0, 2]],
            ['PEOPLE', 'PEOPLE_01.02.25', '0G_13_people.html', [7, -5, 4]],
            ['A HALFWAY KITCHEN', 'A HALFWAY KITCHEN_a vertical farm for food truck docking_21.05.25', '0A_12_verticalfarms.html', [7, 6, 6]],
            ['COMPENSATION FOR CONDENSATION', 'COMPENSATION FOR CONDENSATION_mobile home for metropolitan seoul_15.01.24', '0A_13_condcomp.html', [6, -6, 4]],
            ['UPTOWN RUNWAY', 'UPTOWN RUNWAY(2022)_neighborhood garment recycling infrastructure_23.09.22', '0A_14_ur.html', [4, 3, 6]],
            ['YUJIN MANSIONS', 'YUJIN MANSIONS_Yujin Mansion Revitalization_21.12.21', '0A_15_yj.html', [5, 7, 6]],
            ['DINING WAY', 'DINING WAY_an exclusive food center for singles_20.06.21', '0A_16_dw.html', [5, 2, 5]],
            ['UPTOWN RUNWAY', 'UPTOWN RUNWAY(2025)_neighborhood garment recycling infrastructure_19.11.25', '0A_17_uptownrunway.html', [7, 3, 6]]
        ];

        // 📍 흰색 점 + 라벨 스프라이트
        const whiteDotMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const dotGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const dots = [];

        works.forEach(function (work, i) {
            const [title, description, url, coords] = work;
            const pos = new THREE.Vector3(coords[0], coords[1], coords[2]);

            const dot = new THREE.Mesh(dotGeometry, whiteDotMaterial);
            dot.position.copy(pos);
            dot.userData = { url: url, description: description, thumb: 'thumbnail/' + (i + 1) + '.jpg' };
            scene.add(dot);
            dots.push(dot);

            // 라벨을 캔버스 텍스처 스프라이트로 그린다.
            const labelText = title + '\n(' + coords.join(', ') + ')';
            const lines = labelText.split('\n');
            const fontSize = 48;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            context.font = fontSize + 'px Arial';
            canvas.width = Math.max.apply(null, lines.map(l => context.measureText(l).width));
            canvas.height = fontSize * lines.length;

            context.font = fontSize + 'px Arial';
            context.fillStyle = 'white';
            context.textBaseline = 'top';
            lines.forEach((line, j) => context.fillText(line, 0, j * fontSize));

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(canvas),
                transparent: true
            }));
            sprite.scale.set(1.3, 0.4, 0.4);
            sprite.position.copy(pos).add(new THREE.Vector3(0, 0.5, 0));
            scene.add(sprite);
        });

        // 카메라 위치 설정
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        // 🎮 마우스 드래그 제어 + 호버 감지 (리스너 하나로 처리)
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const descDiv = document.getElementById('dotDescription');
        const previewDiv = document.getElementById('dotPreview');

        let isDragging = false;
        let dragMoved = false;
        let previousMousePosition = { x: 0, y: 0 };
        let hovered = null;
        const rotationSpeed = 0.005;
        const currentRotation = { x: 0, y: 0 };

        function pick(event) {
            pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            // 점 19개를 한 번에 검사한다 (예전에는 점마다 따로 레이캐스트했다).
            const hits = raycaster.intersectObjects(dots, false);
            return hits.length ? hits[0].object : null;
        }

        function setHovered(dot, event) {
            if (hovered === dot) {
                if (dot) {
                    previewDiv.style.left = (event.clientX - 210) + 'px';
                    previewDiv.style.top = (event.clientY - 210) + 'px';
                }
                return;
            }

            if (hovered) hovered.scale.set(1, 1, 1);
            hovered = dot;

            if (dot) {
                dot.scale.set(2, 2, 2);
                descDiv.textContent = dot.userData.description;
                descDiv.style.display = 'block';
                previewDiv.style.backgroundImage = "url('" + dot.userData.thumb + "')";
                previewDiv.style.left = (event.clientX - 210) + 'px';
                previewDiv.style.top = (event.clientY - 210) + 'px';
                previewDiv.style.display = 'block';
                document.body.style.cursor = 'pointer';
            } else {
                descDiv.style.display = 'none';
                previewDiv.style.display = 'none';
                document.body.style.cursor = '';
            }
            invalidate();
        }

        window.addEventListener('mousedown', function (event) {
            isDragging = true;
            dragMoved = false;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        });

        window.addEventListener('mouseup', function () {
            isDragging = false;
        });

        window.addEventListener('mousemove', function (event) {
            if (isDragging) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                if (Math.abs(deltaX) + Math.abs(deltaY) > 2) dragMoved = true;

                currentRotation.y += deltaX * rotationSpeed;
                currentRotation.x += deltaY * rotationSpeed;
                currentRotation.x = Math.max(Math.min(currentRotation.x, Math.PI / 2), -Math.PI / 2);
                currentRotation.y = (currentRotation.y + Math.PI) % (Math.PI * 2) - Math.PI;

                scene.rotation.x = currentRotation.x;
                scene.rotation.y = currentRotation.y;

                previousMousePosition = { x: event.clientX, y: event.clientY };
                invalidate();
            }

            setHovered(pick(event), event);
        });

        // 📍 점을 클릭하면 해당 작업으로 이동 (드래그로 회전한 경우는 제외)
        window.addEventListener('click', function (event) {
            if (dragMoved) return;
            const dot = pick(event);
            if (dot) window.location.href = dot.userData.url;
        });

        // 🖥 창 크기가 바뀌어도 화면이 유지되도록 한다.
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            invalidate();
        });

        // 🔄 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            if (!needsRender) return;
            needsRender = false;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
