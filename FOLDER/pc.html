<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEARL JITTER ARCHIVE</title>
    <meta name="description" content="An archive of architecture and interactive work by pearl jitter, plotted by abstraction, scale and tone.">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" type="text/css" href="simp_landingstyle.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: rgb(0, 0, 0);
        }

        canvas {
            display: block;
            /* 드래그·핀치를 브라우저 스크롤/줌에 뺏기지 않게 한다. */
            touch-action: none;
        }

        .container {
            display: flex;
            justify-content: right;
            align-items: right;
            padding: 10px;
        }

        .moveback-link {
            z-index: 20;
            position: absolute;
            align-items: center;
            justify-content: center;
            text-align: left;
            margin-right: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: transparent;
            border: 1px solid white;
            color: white;
            padding: 5px 5px;
            text-decoration: none;
            font-size: 14px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: white;
            color: black;
        }

        /* 터치 기기에서만 보이는 조작 안내. */
        #touchHint {
            display: none;
            position: fixed;
            left: 50%;
            bottom: 12px;
            transform: translateX(-50%);
            z-index: 25;
            max-width: 92vw;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 3px;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            transition: opacity 0.4s ease;
        }

        @media (pointer: coarse) {
            #touchHint {
                display: block;
            }
        }

        /* 좁은 화면에서 세로 제목과 부제가 'Go to Index' 버튼을 침범하던 문제. */
        @media (max-width: 600px) {
            h2 {
                margin-top: 30px;
                margin-left: 60px;
                max-width: calc(100vw - 190px);
                font-size: 11px;
                line-height: 1.4;
            }

            h1 {
                font-size: 20px;
            }

            /* 설명은 오른쪽 고정 패널 대신 화면 아래 전체 폭으로. */
            #dotDescription {
                right: 0;
                left: 0;
                top: auto;
                bottom: 56px;
                width: auto;
                transform: none;
                padding: 10px 16px;
                font-size: 13px;
                text-align: center;
                background: rgba(0, 0, 0, 0.6);
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <h1>THE ARCHIVE</h1>
    <h2>(abstraction, conceptual depth, scale)</h2>
    <div class="container">
        <div class="moveback-link">
            <a href="../index.html" class="btn">Go to Index</a>
        </div>
    </div>
    <div id="dotDescription"></div>
    <div id="touchHint">한 손가락 드래그: 회전 &nbsp;·&nbsp; 두 손가락: 확대 · 축소<br>점을 탭하면 크게, 한 번 더 탭하면 열기</div>

    <script>
        // 🚀 Three.js 기본 설정
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 정적인 장면이라 매 프레임이 아니라 변화가 있을 때만 렌더링한다.
        let needsRender = true;
        const invalidate = () => { needsRender = true; };

        /*
         * 📌 좌표 격자
         *
         * 이전 격자는 선 간격이 ±7.5 범위인데 선 길이는 ±20이라, 정사각형이
         * 만들어지지 않고 원점에서 뻗어나가는 줄무늬처럼 보였다. 여기서는
         * 범위와 간격을 맞춰 실제 정사각 격자를 만들고, 원점에서 멀어질수록
         * 정점 색을 검정으로 빼서 가장자리가 잘리지 않고 녹아 사라지게 한다.
         * 가산 블렌딩이라 검정은 아무것도 더하지 않고, 선이 겹치는 축 부근만
         * 자연스럽게 밝아진다.
         */
        const GRID_EXTENT = 8;      // 작업 좌표가 ±7 안에 들어온다
        const GRID_STEP = 1;
        const MAJOR_EVERY = 4;      // 네 칸마다 굵은 선
        const FADE_RADIUS = GRID_EXTENT * 1.15;
        const SEGMENTS = 24;        // 한 선을 나눠 그라데이션을 준다

        const MINOR_LEVEL = 0.16;
        const MAJOR_LEVEL = 0.40;
        const AXIS_LEVEL = 0.85;
        const AXIS_LENGTH = 13;

        const minor = { position: [], color: [] };
        const major = { position: [], color: [] };

        // 원점에서의 거리에 따라 0까지 떨어지는 밝기
        function falloff(x, y, z) {
            const r = Math.sqrt(x * x + y * y + z * z) / FADE_RADIUS;
            return Math.max(0, 1 - r * r);
        }

        function addLine(a, b, level, target) {
            for (let s = 0; s < SEGMENTS; s++) {
                for (const t of [s / SEGMENTS, (s + 1) / SEGMENTS]) {
                    const x = a[0] + (b[0] - a[0]) * t;
                    const y = a[1] + (b[1] - a[1]) * t;
                    const z = a[2] + (b[2] - a[2]) * t;
                    const c = falloff(x, y, z) * level;
                    target.position.push(x, y, z);
                    target.color.push(c, c, c);
                }
            }
        }

        const E = GRID_EXTENT;
        for (let i = -E; i <= E; i += GRID_STEP) {
            if (i === 0) continue; // 축은 따로 그린다

            const target = i % MAJOR_EVERY === 0 ? major : minor;
            const level = i % MAJOR_EVERY === 0 ? MAJOR_LEVEL : MINOR_LEVEL;

            addLine([i, -E, 0], [i, E, 0], level, target);   // XY 평면
            addLine([-E, i, 0], [E, i, 0], level, target);
            addLine([0, i, -E], [0, i, E], level, target);   // YZ 평면
            addLine([0, -E, i], [0, E, i], level, target);
            addLine([i, 0, -E], [i, 0, E], level, target);   // ZX 평면
            addLine([-E, 0, i], [E, 0, i], level, target);
        }

        // 📌 x, y, z 축 — 격자와 같은 방식으로 흐려진다
        for (const dir of [[1, 0, 0], [0, 1, 0], [0, 0, 1]]) {
            addLine(
                [-dir[0] * AXIS_LENGTH, -dir[1] * AXIS_LENGTH, -dir[2] * AXIS_LENGTH],
                [dir[0] * AXIS_LENGTH, dir[1] * AXIS_LENGTH, dir[2] * AXIS_LENGTH],
                AXIS_LEVEL, major
            );
        }

        // 선 186개를 두 개의 LineSegments로 합친다.
        for (const data of [minor, major]) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(data.position, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(data.color, 3));

            const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                transparent: true
            }));
            lines.renderOrder = -1;
            scene.add(lines);
        }

        /*
         * 🔤 글자를 캔버스에 그려 스프라이트로 만든다.
         *
         * 축 라벨은 원래 3D TextGeometry였는데, 원근 때문에 카메라 쪽 축의
         * 글자만 몇 배로 커져 구도를 깨뜨렸다. 스프라이트는 항상 카메라를
         * 향하고 크기가 일정해서 여섯 축이 같은 무게로 읽힌다.
         * 덤으로 threejs.org에서 받아오던 폰트 의존성도 사라진다.
         */
        function makeTextSprite(rows, worldHeight, opacity, image) {
            const PAD = 10;
            const GAP = 6;
            const THUMB = 190;        // 캔버스 안에서의 썸네일 한 변
            const THUMB_GAP = 12;
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            const font = row => (row.weight || '400') + ' ' + row.size + 'px Arial';

            let width = image ? THUMB : 0;
            let height = PAD * 2 + (image ? THUMB + THUMB_GAP : 0);
            rows.forEach(function (row, i) {
                context.font = font(row);
                width = Math.max(width, context.measureText(row.text).width);
                height += row.size + (i ? GAP : 0);
            });

            canvas.width = Math.ceil(width) + PAD * 2;
            canvas.height = Math.ceil(height);

            let y = PAD;
            if (image) {
                const x = (canvas.width - THUMB) / 2;
                context.drawImage(image, x, y, THUMB, THUMB);
                // 검은 배경 위에서 썸네일 경계를 잡아주는 얇은 테두리.
                context.strokeStyle = 'rgba(255, 255, 255, 0.55)';
                context.lineWidth = 2;
                context.strokeRect(x + 1, y + 1, THUMB - 2, THUMB - 2);
                y += THUMB + THUMB_GAP;
            }

            context.textAlign = 'center';
            context.textBaseline = 'top';
            rows.forEach(function (row, i) {
                context.font = font(row);
                context.fillStyle = row.color || '#ffffff';
                context.fillText(row.text, canvas.width / 2, y + (i ? GAP : 0));
                y += row.size + (i ? GAP : 0);
            });

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter; // 2의 거듭제곱이 아닌 크기
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                opacity: opacity
            }));
            sprite.scale.set(worldHeight * (canvas.width / canvas.height), worldHeight, 1);
            // 선택했을 때 되돌아올 기준 크기.
            sprite.userData.baseScale = sprite.scale.clone();
            return sprite;
        }

        // 📚 축 라벨 — 여섯 개를 같은 거리, 같은 크기로.
        // (이전에는 BIG/SMALL만 10.7, 나머지는 32라 축마다 거리가 달랐다.)
        const AXIS_LABEL_RADIUS = 8.9;
        const axisLabels = [
            ['CONCRETE', [1, 0, 0]],
            ['ABSTRACT', [-1, 0, 0]],
            ['BIG', [0, 1, 0]],
            ['SMALL', [0, -1, 0]],
            ['SERIOUS', [0, 0, 1]],
            ['PLAYFUL', [0, 0, -1]]
        ];

        const AXIS_LABEL_SIZE = 0.055;
        const axisSprites = [];

        for (const [text, dir] of axisLabels) {
            const sprite = makeTextSprite([{ text: text, size: 40, weight: '600' }], AXIS_LABEL_SIZE, 0.8);
            /*
             * 축 이름은 좌표계의 기준이라 여섯 개가 같은 무게로 읽혀야 한다.
             * 원근 축소를 끄면 어느 축이 카메라 쪽으로 돌아오든 크기가 같다.
             * (작업 라벨은 반대로 원근을 유지해서 멀수록 물러나게 둔다.)
             */
            sprite.material.sizeAttenuation = false;
            sprite.position.set(
                dir[0] * AXIS_LABEL_RADIUS,
                dir[1] * AXIS_LABEL_RADIUS,
                dir[2] * AXIS_LABEL_RADIUS
            );
            // 화면 비율에 맞춰 다시 계산할 때 쓴다.
            sprite.userData.aspect = sprite.scale.x / sprite.scale.y;
            axisSprites.push(sprite);
            scene.add(sprite);
        }

        // 📍 작업 목록 — 제목 / 설명 / 링크 / 좌표를 한 곳에서 관리한다.
        // 좌표는 (구체성, 규모, 진지함).
        const works = [
            ['FUZZY UNIVERSE', 'FUZZY UNIVERSE_Interactive Sketch_Object Exercise_11.09.23', '0G_1_fuzzy.html', [-6, 5, -3]],
            ['CHUNKING RUN', 'CHUNKING RUN_Flash Game_A Sequel of a Trip to Hong Kong_01.01.24', '0G_2_chunking.html', [2, -3, -4]],
            ['STRAGGLER CARRIER', 'STRAGGLER CARRIER_Flash Game_A Sequel of a Trip to JungSeon_11.02.24', '0G_3_ski.html', [1, -1, -3]],
            ['ORIGAMI DRAGON', 'ORIGAMI DRAGON_Interactive Sketch_Mouse Interaction Exercise_01.08.20', '0G_4_dragon.html', [-2, -5, 1]],
            ['GALAGA', 'GALAGA_Flash Game_Arcade Game Exercise_11.09.20', '0G_5_galaga.html', [1, 5, 1]],
            ['PACGUY', 'PACGUY_Flash Game_Arcade Game Exercise_29.09.20', '0G_6_pacguy.html', [0, -4, -4]],
            ['GATHER', 'GATHER_Interactive Sketch_Gravity Exercise_14.04.24', '0G_7_gather.html', [-5, 6, -2]],
            ['TANGHULU', 'TANGHULU_Interactive Sketch_Object Exercise_11.09.10', '0G_8_tanghulu.html', [-4, -6, -5]],
            ['THOUGHTS', 'THOUGHTS_Text_27.01.25~', '0T_9_blog.html', [0, 0, 0]],
            ['VIRTIAL ESSENCE', 'VIRTIAL ESSENCE_Series of Interactive Sketches_06.12.24~', '0G_10_virtualEssence.html', [3, 0, 5]],
            ['A SHELTER OF HOMEOSTASIS', "A SHELTER OF HOMEOSTASIS_a sustainable alternative to an 'idealized nature'_21.11.24", '0A_11_homeostasis.html', [6, -2, 6]],
            ['READER', 'READER_09.03.25', '0G_12_reader.html', [6, 0, 2]],
            ['PEOPLE', 'PEOPLE_01.02.25', '0G_13_people.html', [7, -5, 4]],
            ['A HALFWAY KITCHEN', 'A HALFWAY KITCHEN_a vertical farm for food truck docking_21.05.25', '0A_12_verticalfarms.html', [7, 6, 6]],
            ['COMPENSATION FOR CONDENSATION', 'COMPENSATION FOR CONDENSATION_mobile home for metropolitan seoul_15.01.24', '0A_13_condcomp.html', [6, -6, 4]],
            ['UPTOWN RUNWAY', 'UPTOWN RUNWAY(2022)_neighborhood garment recycling infrastructure_23.09.22', '0A_14_ur.html', [4, 3, 6]],
            ['YUJIN MANSIONS', 'YUJIN MANSIONS_Yujin Mansion Revitalization_21.12.21', '0A_15_yj.html', [5, 7, 6]],
            ['DINING WAY', 'DINING WAY_an exclusive food center for singles_20.06.21', '0A_16_dw.html', [5, 2, 5]],
            ['UPTOWN RUNWAY', 'UPTOWN RUNWAY(2025)_neighborhood garment recycling infrastructure_19.11.25', '0A_17_uptownrunway.html', [7, 3, 6]]
        ];

        /*
         * 📍 흰색 점 + 라벨 스프라이트
         *
         * 썸네일은 예전처럼 마우스를 올렸을 때만 뜨는 HTML 오버레이가 아니라
         * 라벨 자체에 그려 넣어 항상 보이게 한다. 열아홉 개가 한 화면에
         * 있으니 평소에는 흐리게 두고, 가리킨 것만 밝히고 고른 것만 키운다.
         */
        const LABEL_IDLE_OPACITY = 0.72;
        const LABEL_ACTIVE_OPACITY = 1;
        const LABEL_HEIGHT = 2.0;
        const SELECTED_GROWTH = 1.3;   // 클릭했을 때 커지는 정도

        const whiteDotMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const dotGeometry = new THREE.SphereGeometry(0.09, 16, 16);
        const dots = [];

        works.forEach(function (work, i) {
            const [title, description, url, coords] = work;
            const pos = new THREE.Vector3(coords[0], coords[1], coords[2]);

            const dot = new THREE.Mesh(dotGeometry, whiteDotMaterial);
            dot.position.copy(pos);
            dot.userData = { url: url, description: description, thumb: 'thumbnail/' + (i + 1) + '.jpg' };
            scene.add(dot);
            dots.push(dot);

            /*
             * 라벨은 글자 길이와 상관없이 scale이 (1.3, 0.4)로 고정돼 있어서
             * 'COMPENSATION FOR CONDENSATION'은 찌그러지고 'GALAGA'는 늘어났다.
             * 캔버스 비율 그대로 스케일을 잡아 글자 모양을 유지한다.
             */
            const rows = [
                { text: title, size: 40, weight: '600' },
                // 좌표는 제목보다 한 단계 낮은 정보라 작고 흐리게.
                { text: '(' + coords.join(', ') + ')', size: 28, color: 'rgba(255,255,255,0.55)' }
            ];

            function attach(image) {
                const sprite = makeTextSprite(rows, LABEL_HEIGHT, LABEL_IDLE_OPACITY, image);
                sprite.position.copy(pos).add(new THREE.Vector3(0, 0.18, 0));
                sprite.center.set(0.5, 0);   // 점 바로 위에 붙인다
                scene.add(sprite);
                dot.userData.sprite = sprite;
                invalidate();
            }

            // 썸네일을 받은 뒤 라벨을 만든다. 못 받으면 글자만으로 만든다.
            const image = new Image();
            image.onload = function () { attach(image); };
            image.onerror = function () { attach(null); };
            image.src = dot.userData.thumb;
        });

        /*
         * 카메라와 축 라벨을 화면 비율에 맞춘다.
         *
         * 세로로 긴 휴대폰에서는 가로 화각이 훨씬 좁아서, 데스크톱 기준으로
         * 잡아둔 거리로는 ABSTRACT / PLAYFUL 라벨이 좌우로 잘려 나갔다.
         * 좁은 쪽 화각을 기준으로 거리를 정하고, 화면 높이에 비례하는 축
         * 라벨은 세로 화면에서 폭을 덜 차지하도록 함께 줄인다.
         */
        const FIT_RADIUS = 11.5;
        const MAX_FIT_DISTANCE = 26;
        let zoomTouched = false;   // 사용자가 직접 확대했으면 건드리지 않는다

        camera.position.set(1, 1, 1);

        function layoutForViewport() {
            const vFov = camera.fov * Math.PI / 180;
            const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
            const distance = Math.min(
                FIT_RADIUS / Math.sin(Math.min(vFov, hFov) / 2),
                MAX_FIT_DISTANCE
            );

            if (!zoomTouched) {
                camera.position.setLength(distance);
                camera.lookAt(0, 0, 0);
            }

            const size = AXIS_LABEL_SIZE * Math.min(1, camera.aspect / 1.3);
            for (const sprite of axisSprites) {
                sprite.scale.set(size * sprite.userData.aspect, size, 1);
            }
            invalidate();
        }

        layoutForViewport();

        // 🎮 조작 — 마우스와 터치를 함께 지원한다.
        const descDiv = document.getElementById('dotDescription');
        const touchHint = document.getElementById('touchHint');

        let isDragging = false;
        let dragMoved = false;
        let previousMousePosition = { x: 0, y: 0 };
        let hovered = null;
        let selected = null;   // 첫 클릭/탭으로 고른 점
        const rotationSpeed = 0.005;
        const currentRotation = { x: 0, y: 0 };

        const MIN_DISTANCE = 6;
        const MAX_DISTANCE = 45;

        /*
         * 화면 좌표로 점을 고른다.
         * 레이캐스트는 반지름 0.1짜리 구를 정확히 맞춰야 해서 손가락으로는 거의
         * 불가능했다. 대신 점을 화면에 투영해 가장 가까운 것을 반경 안에서 찾는다.
         */
        const _projected = new THREE.Vector3();

        function pickAt(clientX, clientY, radiusPx) {
            let best = null;
            let bestDistance = radiusPx;

            for (const dot of dots) {
                // 씬 전체가 회전할 뿐이라 회전만 적용하면 월드 좌표가 나온다.
                _projected.copy(dot.position).applyQuaternion(scene.quaternion).project(camera);
                if (_projected.z > 1) continue; // 카메라 뒤

                const sx = (_projected.x * 0.5 + 0.5) * window.innerWidth;
                const sy = (-_projected.y * 0.5 + 0.5) * window.innerHeight;
                const distance = Math.hypot(sx - clientX, sy - clientY);

                if (distance < bestDistance) {
                    bestDistance = distance;
                    best = dot;
                }
            }
            return best;
        }

        // 라벨의 밝기와 크기는 상태에 따라 세 단계다: 기본 / 가리킴 / 선택.
        function applyLabelState(dot) {
            const sprite = dot.userData.sprite;
            if (!sprite) return;   // 썸네일을 아직 못 받았다

            const isSelected = dot === selected;
            const isActive = isSelected || dot === hovered;

            sprite.material.opacity = isActive ? LABEL_ACTIVE_OPACITY : LABEL_IDLE_OPACITY;
            const growth = isSelected ? SELECTED_GROWTH : 1;
            sprite.scale.copy(sprite.userData.baseScale).multiplyScalar(growth);
            // 커진 라벨이 이웃에 가리지 않도록 앞으로 꺼낸다.
            sprite.renderOrder = isSelected ? 2 : (isActive ? 1 : 0);
            dot.scale.setScalar(isActive ? 2 : 1);
        }

        function setHovered(dot) {
            if (hovered === dot) return;
            const previous = hovered;
            hovered = dot;
            if (previous) applyLabelState(previous);
            if (dot) applyLabelState(dot);

            const shown = dot || selected;
            if (shown) {
                descDiv.textContent = shown.userData.description;
                descDiv.style.display = 'block';
            } else {
                descDiv.style.display = 'none';
            }
            document.body.style.cursor = dot ? 'pointer' : '';
            invalidate();
        }

        // 첫 클릭(탭)은 고르기, 같은 점을 다시 누르면 열기.
        function activate(dot) {
            if (dot && dot === selected) {
                window.location.href = dot.userData.url;
                return;
            }

            const previous = selected;
            selected = dot;
            if (previous) applyLabelState(previous);
            if (dot) {
                applyLabelState(dot);
                descDiv.textContent = dot.userData.description;
                descDiv.style.display = 'block';
                if (touchHint) touchHint.style.opacity = '0';
            } else if (!hovered) {
                descDiv.style.display = 'none';
            }
            invalidate();
        }

        function rotateBy(deltaX, deltaY) {
            currentRotation.y += deltaX * rotationSpeed;
            currentRotation.x += deltaY * rotationSpeed;
            currentRotation.x = Math.max(Math.min(currentRotation.x, Math.PI / 2), -Math.PI / 2);
            currentRotation.y = (currentRotation.y + Math.PI) % (Math.PI * 2) - Math.PI;

            scene.rotation.x = currentRotation.x;
            scene.rotation.y = currentRotation.y;
            invalidate();
        }

        function zoomTo(distance) {
            zoomTouched = true;
            camera.position.setLength(Math.min(Math.max(distance, MIN_DISTANCE), MAX_DISTANCE));
            camera.lookAt(0, 0, 0);
            invalidate();
        }

        // ---------------------------------------------------------------- 마우스
        window.addEventListener('mousedown', function (event) {
            isDragging = true;
            dragMoved = false;
            previousMousePosition = { x: event.clientX, y: event.clientY };
        });

        window.addEventListener('mouseup', function () {
            isDragging = false;
        });

        window.addEventListener('mousemove', function (event) {
            if (isDragging) {
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;
                if (Math.abs(deltaX) + Math.abs(deltaY) > 2) dragMoved = true;

                rotateBy(deltaX, deltaY);
                previousMousePosition = { x: event.clientX, y: event.clientY };
            }

            setHovered(pickAt(event.clientX, event.clientY, 18));
        });

        // 📍 클릭은 고르기, 같은 점을 한 번 더 클릭하면 이동
        // (드래그로 회전한 경우는 제외)
        window.addEventListener('click', function (event) {
            if (dragMoved) return;
            activate(pickAt(event.clientX, event.clientY, 18));
        });

        window.addEventListener('wheel', function (event) {
            event.preventDefault();
            zoomTo(camera.position.length() * (event.deltaY > 0 ? 1.1 : 0.9));
        }, { passive: false });

        // ---------------------------------------------------------------- 터치
        // 한 손가락은 회전, 두 손가락은 확대·축소. 탭은 손가락 굵기를 감안해
        // 넉넉한 반경으로 판정하고, 실수로 열리지 않도록 두 단계로 나눈다.
        let touchStart = null;
        let pinchStartDistance = 0;
        let pinchStartCameraDistance = 0;

        function touchGap(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        renderer.domElement.addEventListener('touchstart', function (event) {
            if (event.touches.length === 1) {
                const t = event.touches[0];
                touchStart = { x: t.clientX, y: t.clientY, time: Date.now(), moved: false };
                previousMousePosition = { x: t.clientX, y: t.clientY };
            } else if (event.touches.length === 2) {
                touchStart = null;
                pinchStartDistance = touchGap(event.touches);
                pinchStartCameraDistance = camera.position.length();
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchmove', function (event) {
            event.preventDefault();

            if (event.touches.length === 1 && touchStart) {
                const t = event.touches[0];
                const deltaX = t.clientX - previousMousePosition.x;
                const deltaY = t.clientY - previousMousePosition.y;

                if (Math.abs(t.clientX - touchStart.x) + Math.abs(t.clientY - touchStart.y) > 10) {
                    touchStart.moved = true;
                }

                rotateBy(deltaX, deltaY);
                previousMousePosition = { x: t.clientX, y: t.clientY };
            } else if (event.touches.length === 2 && pinchStartDistance > 0) {
                const gap = touchGap(event.touches);
                if (gap > 0) zoomTo(pinchStartCameraDistance * (pinchStartDistance / gap));
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchend', function (event) {
            if (event.touches.length === 0) pinchStartDistance = 0;
            if (!touchStart || touchStart.moved || Date.now() - touchStart.time > 500) {
                touchStart = null;
                return;
            }

            const x = touchStart.x;
            const y = touchStart.y;
            touchStart = null;

            // 마우스 클릭과 같은 흐름: 첫 탭은 고르기, 다시 탭하면 열기.
            activate(pickAt(x, y, 44));
        });

        // 🖥 창 크기가 바뀌어도 화면이 유지되도록 한다.
        window.addEventListener('resize', function () {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            layoutForViewport();
        });

        // 🔄 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);
            if (!needsRender) return;
            needsRender = false;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
