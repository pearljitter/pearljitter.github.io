<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pearl jitter</title>
    <meta name="description" content="Portfolio of pearl jitter: architecture projects and interactive sketches.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="FOLDER/css/base.css">
    <style>
        :root {
            --ink: #f5f5f7;
            --ink-dim: rgba(245, 245, 247, 0.56);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
        }

        .mark {
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-dim);
            margin: 0 0 auto;
            padding-top: 8px;
        }

        .stage {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 8vw, 72px);
            font-weight: 600;
            letter-spacing: var(--tracking-display);
            line-height: 1.05;
        }

        p {
            margin: 0;
            max-width: 30ch;
            font-size: 17px;
            line-height: 1.5;
            color: var(--ink-dim);
        }

        .enter {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            padding: 12px 24px;
            border-radius: 999px;
            background: var(--ink);
            color: #000;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: var(--tracking-tight);
            transition: transform var(--duration) var(--ease-out), opacity 0.3s var(--ease-out);
        }

        .enter:hover {
            transform: scale(1.04);
            opacity: 0.92;
        }

        .enter svg {
            width: 14px;
            height: 14px;
        }

        footer {
            margin: auto 0 0;
            font-size: 12px;
            color: rgba(245, 245, 247, 0.32);
        }
    </style>
</head>

<body>
    <p class="mark">@pearl.jitter</p>

    <div class="stage">
        <h1>pearl jitter</h1>
        <p>Architecture and interactive work, arranged by abstraction, scale and tone.</p>
        <a class="enter" href="FOLDER/pc.html">
            Enter the archive
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </a>
    </div>

    <footer>Heejin Urm</footer>
</body>

</html>
