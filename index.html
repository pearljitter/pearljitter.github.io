<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pearl jitter</title>
    <meta name="description" content="Portfolio of pearl jitter: architecture projects and interactive sketches.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="FOLDER/css/base.css">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * 페이지 전체가 이 진주 하나다 — 호버하면 커지고, 클릭하면 아카이브로
         * 들어간다. 커지는 것(:hover, 바깥 링크)과 계속 떠는 것(애니메이션,
         * 안쪽 진주 자체)을 서로 다른 요소에 나눠 맡긴다 — 같은 요소에서
         * transform 을 두 군데(하나는 :hover, 하나는 애니메이션)서 같이
         * 쓰면 애니메이션이 늘 이긴다.
         */
        .pearl-link {
            display: block;
            width: clamp(120px, 20vw, 200px);
            height: clamp(120px, 20vw, 200px);
            border-radius: 50%;
            text-decoration: none;
            transition: transform 0.35s var(--ease-out);
        }

        .pearl-link:hover,
        .pearl-link:focus-visible {
            transform: scale(1.14);
        }

        /* 호버하면 같은 떨림을 그대로, 다만 더 빠르게 — 지속시간만 줄인다 */
        .pearl-link:hover .pearl,
        .pearl-link:focus-visible .pearl {
            animation-duration: 1s;
        }

        .pearl-link:hover .pearl::before,
        .pearl-link:focus-visible .pearl::before {
            animation-duration: 1s;
        }

        /*
         * 떨리는 흰 진주알. 라디얼 그라디언트와 겹친 inset 그림자로 유리질
         * 광택을 내고, 발밑의 옅은 그림자로 바닥에 놓여 있다는 감각을 준다.
         * @keyframes 는 규칙적인 파형 대신 어긋난 퍼센트 지점을 써서
         * 신경질적으로 떠는 느낌을 낸다.
         */
        .pearl {
            display: block;
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 24%,
                    #ffffff 0%,
                    #ffffff 9%,
                    #f2f3f5 24%,
                    #d3d4da 48%,
                    #989aa3 76%,
                    #6b6c76 100%);
            box-shadow:
                inset -16px -16px 28px rgba(0, 0, 0, 0.42),
                inset 13px 13px 20px rgba(255, 255, 255, 0.8),
                0 22px 40px rgba(0, 0, 0, 0.55);
            animation: pearl-jitter 3.4s ease-in-out infinite;
        }

        /* 작고 또렷한 반사광 — 넓게 퍼지는 ::after 위에 얹혀 "젖은" 광택을 낸다 */
        .pearl__gloss {
            position: absolute;
            top: 15%;
            left: 21%;
            width: 10%;
            height: 7%;
            border-radius: 50%;
            background: #ffffff;
            filter: blur(0.5px);
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.85);
        }

        /* 진주 표면 약간 위 왼쪽에 작게 음각으로 새긴 이름 */
        .pearl__mark {
            position: absolute;
            top: 27%;
            left: 20%;
            z-index: 1;
            max-width: 46%;
            font-size: clamp(9px, 1vw, 11px);
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1.25;
            color: #1c1c1e;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55), 0 -1px 1px rgba(0, 0, 0, 0.3);
            user-select: none;
        }

        .pearl::after {
            content: '';
            position: absolute;
            top: 18%;
            left: 24%;
            width: 22%;
            height: 15%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.98);
            filter: blur(1.5px);
        }

        .pearl::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -20px;
            width: 68%;
            height: 16px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5), transparent 72%);
            filter: blur(2px);
            animation: pearl-shadow-jitter 3.4s ease-in-out infinite;
        }

        @keyframes pearl-jitter {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            8% {
                transform: translate(-2px, 1.5px) rotate(-0.7deg);
            }

            17% {
                transform: translate(1.5px, -2px) rotate(0.6deg);
            }

            26% {
                transform: translate(-2.5px, -0.5px) rotate(-0.5deg);
            }

            35% {
                transform: translate(2px, 2px) rotate(0.8deg);
            }

            44% {
                transform: translate(-1px, 2.5px) rotate(-0.4deg);
            }

            53% {
                transform: translate(2.5px, -1.5px) rotate(0.6deg);
            }

            62% {
                transform: translate(-2px, -2px) rotate(-0.7deg);
            }

            71% {
                transform: translate(1.5px, 1px) rotate(0.5deg);
            }

            80% {
                transform: translate(-0.5px, -1.5px) rotate(-0.3deg);
            }

            90% {
                transform: translate(2px, 0.5px) rotate(0.6deg);
            }
        }

        @keyframes pearl-shadow-jitter {

            0%,
            100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(0.94);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .pearl,
            .pearl::before {
                animation: none;
            }

            .pearl-link:hover,
            .pearl-link:focus-visible {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <a class="pearl-link" href="FOLDER/pc.html" aria-label="Enter the archive">
        <span class="pearl">
            <span class="pearl__gloss" aria-hidden="true"></span>
            <span class="pearl__mark">@pearl.jitter</span>
        </span>
    </a>
</body>

</html>
